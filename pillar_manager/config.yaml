name: "Pillar Manager"
version: "1.0.3"
slug: "pillar_manager"
description: "Manage and install Pillar Cards and dashboard packages for Home Assistant without HACS."
image: "ghcr.io/pillar-integrated/pillar-manager"
url: "https://github.com/Pillar-Integrated/pillar-manager-release"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:view-grid-plus"
panel_title: "Pillar Manager"
panel_admin: true
map:
  - homeassistant_config:rw
  - media:rw
options:
  enable_pillar_cards: false
  auto_update: false
  check_interval_hours: 6
schema:
  enable_pillar_cards: bool
  auto_update: bool
  check_interval_hours: int(1,24)
